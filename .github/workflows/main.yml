name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            target: x86_64-linux-musl
          - os: macos-latest
            target: aarch64-macos
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Run our checks to catch quick issues
      - run: nix flake check

      - run: nix develop -c zig env

      - name: Run tests 
        run: nix develop -c zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --summary all

      # the core must build for the web, with no I/O and no libc
      - name: Build for wasm
        if: matrix.os == 'ubuntu-latest'
        run: nix develop -c zig build wasm --summary all

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.0"

      - run: zig env

      - name: Run tests 
        run: zig build test -Dtarget=x86_64-windows-gnu -Doptimize=ReleaseSafe --summary all

  coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Install Nix and use that to run our tests so our environment matches exactly.
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      # Run our checks to catch quick issues
      - run: nix flake check

      - run: nix develop -c zig env

      - name: Run tests with coverage
        run: nix develop -c zig build test -Dcoverage -Dtarget=x86_64-linux-musl --summary all

      # Codecov happily accepts an empty report, so fail if kcov found nothing
      - name: Check coverage report is not empty
        run: |
          total_lines=$(jq .total_lines zig-out/coverage/kcov-merged/coverage.json)
          echo "total_lines: $total_lines"
          if [ "$total_lines" -eq 0 ]; then
            echo "::error::Coverage report is empty (total_lines is 0)"
            exit 1
          fi

      - name: Upload to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: zig-out/coverage/kcov-merged
          fail_ci_if_error: true
          verbose: true
