name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  # The tag is the release's version, so it must agree with build.zig.zon
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check tag matches version
        run: |
          version=$(sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' build.zig.zon)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match build.zig.zon version $version"
            exit 1
          fi

  build:
    needs: check-version
    strategy:
      fail-fast: true
      matrix:
        include:
          # the GUI links glibc, not musl: SDL3 loads X11 or Wayland as it
          # starts, which a static binary cannot
          - os: ubuntu-latest
            target: x86_64-linux-musl
            gui_target: x86_64-linux-gnu
            name: x86_64-linux
            test: true
          - os: ubuntu-latest
            target: aarch64-linux-musl
            gui_target: aarch64-linux-gnu
            name: aarch64-linux
          - os: macos-latest
            target: aarch64-macos
            gui_target: aarch64-macos
            name: aarch64-macos
            test: true
          - os: macos-latest
            target: x86_64-macos
            gui_target: x86_64-macos
            name: x86_64-macos
          - os: windows-latest
            target: x86_64-windows-gnu
            gui_target: x86_64-windows-gnu
            name: x86_64-windows
            test: true
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: "0.17.0"

      # Only the targets the runner can execute are tested
      - name: Run tests
        if: matrix.test
        run: zig build test -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe --summary all

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dstrip --prefix out

      # with SDL3 built from source and linked in, so it needs no SDL
      # installed. Apart, as on Linux it is for another target than gasim
      - name: Build the GUI
        run: |
          zig build -Dgui -Dtarget=${{ matrix.gui_target }} -Doptimize=ReleaseFast -Dstrip -fno-sys=sdl3 --prefix gui
          cp gui/bin/gasim-gui* out/bin/

      - name: Package
        run: |
          dir=gasim-$GITHUB_REF_NAME-${{ matrix.name }}
          mkdir "$dir"
          rm -f out/bin/*.pdb
          cp out/bin/* README.md LICENSE "$dir"
          cp -R out/share/gasim/examples "$dir"
          if [ "${{ runner.os }}" = Windows ]; then
            7z a "$dir.zip" "$dir"
          else
            tar czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}
          path: |
            gasim-*.tar.gz
            gasim-*.zip
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" ./* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
